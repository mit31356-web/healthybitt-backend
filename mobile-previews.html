<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthyBit Mobile Previews</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #6366f1;
      --text-color: #f3f4f6;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo-section h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-section p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      background: var(--accent-color);
      border: none;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    .preview-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 48px;
      padding: 24px;
      overflow-y: auto;
    }

    .device-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .device-label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-label span {
      background: var(--card-bg);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      border: 1px solid var(--border-color);
    }

    /* iPhone 15 Pro Simulator Frame */
    .phone-frame.ios {
      width: 393px;
      height: 852px;
      border: 12px solid #2d3748;
      border-radius: 48px;
      background: #000;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255,255,255,0.1);
    }

    /* Dynamic Island */
    .phone-frame.ios::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      z-index: 5;
    }

    /* Android Pixel 8 Pro Simulator Frame */
    .phone-frame.android {
      width: 393px;
      height: 851px;
      border: 10px solid #1a202c;
      border-radius: 40px;
      background: #000;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255,255,255,0.1);
    }

    /* Punch hole camera */
    .phone-frame.android::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000;
      border-radius: 50%;
      z-index: 5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 36px;
      background: #fff;
    }

    .phone-frame.android iframe {
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-section">
      <h1>HealthyBit Developer Hub</h1>
      <p>Mobile Device Preview (Dual Viewport Mode)</p>
    </div>
    <div class="controls">
      <button class="btn" onclick="refreshAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Refresh Preview
      </button>
      <button class="btn btn-primary" onclick="openDirect()">
        Open App Direct
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
      </button>
    </div>
  </header>

  <div class="preview-container">
    <div class="device-wrapper">
      <div class="device-label">
         iPhone 15 Pro
        <span>iOS Viewport: 393 × 852</span>
      </div>
      <div class="phone-frame ios">
        <iframe id="ios-frame" src="http://localhost:5173/"></iframe>
      </div>
    </div>

    <div class="device-wrapper">
      <div class="device-label">
        🤖 Pixel 8 Pro
        <span>Android Viewport: 393 × 851</span>
      </div>
      <div class="phone-frame android">
        <iframe id="android-frame" src="http://localhost:5173/"></iframe>
      </div>
    </div>
  </div>

  <script>
    function refreshAll() {
      document.getElementById('ios-frame').contentWindow.location.reload();
      document.getElementById('android-frame').contentWindow.location.reload();
    }

    function openDirect() {
      window.open('http://localhost:5173/', '_blank');
    }
  </script>
</body>
</html>
